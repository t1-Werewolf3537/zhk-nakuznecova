<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, minimal-ui">
  
  <title>ЖК &quot;Дом на Кузнецова&quot; 3D-тур по 2-комнатной квартире | Кирилл Бахарев</title>  
  <meta name="description" content="3D-тур по квартире в ЖК «Дом на Кузнецова» 2-комнатная квартира (50 кв.м). Профессиональная 3D-визуализация интерьера | Кирилл Бахарев">

  <!-- Open Graph для мессенджеров и соцсетей -->
  <meta property="og:type" content="website"> 
  <meta property="og:title" content="3D-тур ЖК Дом на Кузнецова | 2-комнатная квартира 50м²"> 
  <meta property="og:description" content="Виртуальный тур по интерьеру квартиры | Кирилл Бахарев."> 
  <meta property="og:url" content="https://zhk-nakuznecova.wolf-studio.ru/tip6p/"> 
  <meta property="og:image" content="https://wolf-studio.ru/img/preview.jpg">

  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="../favicon.png">
</head>

<body class="multiple-scenes">

  <!-- Контейнер панорамы -->
  <div id="pano"></div>
  <div id="demo-watermark-overlay" class="demo-watermark-layer" aria-hidden="true"></div>

  <!-- Подсказка при прокрутке внутри iframe -->
  <div id="iframe-scroll-hint" aria-hidden="true">
    Кликните по 3D-туру или зажмите Ctrl для масштабирования
  </div>

  <!-- Выезжающее меню выбора других квартир -->
  <div id="sceneList">
    <ul class="scenes">
      <li class="scene">
        <a href="https://zhk-nakuznecova.wolf-studio.ru/tip8p/" class="text">Тип-8П | 3-ЕВРО 69м²</a>
      </li>
      <li class="scene">
        <a href="https://zhk-nakuznecova.wolf-studio.ru/tip10l/" class="text">Тип-10Л | 2-ЕВРО 47м²</a>
      </li>
    </ul>
  </div>

  <!-- Верхняя плашка с названием -->
  <div id="titleBar">
    <h1 class="sceneName">Тип-6П | 2-ЕВРО 50м²</h1>
  </div>

  <!-- Кнопка открытия меню квартир -->
  <a href="javascript:void(0)" id="sceneListToggle" aria-label="Меню выбора квартир">
    <img class="icon off" src="img/expand.png" alt="Открыть меню">
    <img class="icon on" src="img/collapse.png" alt="Закрыть меню">
  </a>

  <!-- Логотип застройщика и текстовый баннер -->
  <a href="https://na-kuznetsova.ru/" target="_blank" rel="noopener noreferrer" class="custom-zhk-top-round">
    <img src="img/logo_zhk.png" alt="ЖК Дом на Кузнецова" class="zhk-round-img">
  </a>
  <div class="custom-dynamic-image-container">
    <img src="img/text_zhk.png" class="dynamic-responsive-img" alt="ЖК Дом на Кузнецова">
  </div>

  <!-- Кнопка гироскопа (управляется через ENABLE_GYROSCOPE на мобильных) -->
  <button type="button" id="gyroscope-toggle-btn" class="gyroscope-btn is-hidden" title="Управление гироскопом" aria-label="Управление гироскопом">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"></circle>
      <ellipse cx="12" cy="12" rx="9" ry="3.8"></ellipse>
      <ellipse cx="12" cy="12" rx="3.8" ry="9"></ellipse>
    </svg>
  </button>

  <!-- Кнопка полноэкранного режима (управляется через ENABLE_FULLSCREEN) -->
  <button type="button" id="fullscreen-toggle-btn" class="fullscreen-btn" title="На полный экран" aria-label="На полный экран">
    <svg class="fs-icon-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 3 21 3 21 9"></polyline>
      <polyline points="9 21 3 21 3 15"></polyline>
      <line x1="21" y1="3" x2="14" y2="10"></line>
      <line x1="3" y1="21" x2="10" y2="14"></line>
    </svg>
    <svg class="fs-icon-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="4 14 10 14 10 20"></polyline>
      <polyline points="20 10 14 10 14 4"></polyline>
      <line x1="14" y1="10" x2="21" y2="3"></line>
      <line x1="3" y1="21" x2="10" y2="14"></line>
    </svg>
  </button>

  <!-- Водяной знак Wolf Studio -->
  <a href="https://wolf-studio.ru" target="_blank" rel="noopener noreferrer" class="custom-wolf-watermark-bottom">
    <img src="img/circle.png" class="wolf-watermark-bg" alt="">
    <img src="img/site.png" class="wolf-watermark-icon" alt="Wolf Studio">
  </a>

  <!-- Мини-карта планировки -->
  <button id="mini-map-toggle-btn" class="map-open-button">Планировка</button>

  <div id="mini-map-wrapper">
    <div id="mini-map-close-btn">&times;</div>
    <div class="map-inner">
      <img src="img/plan.jpg" id="mini-map-img" alt="Планировка Дом на Кузнецова Новокузнецк 2-комнатная 50м²">
      <div id="mini-map-points"></div>
      <div id="mini-map-dot"></div>
    </div>
  </div>

  <!-- iOS-переключатель варианта отделки -->
  <div class="ios-switch-wrapper">
    <label class="ios-switch">
      <input type="checkbox" id="finish-variant-toggle-btn" aria-label="Переключить вариант отделки">
      <span class="ios-switch-slider"></span>
    </label>
    <div id="finish-variant-hint" class="ios-switch-label-box">
      <svg class="hint-arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="19" x2="12" y2="5"></line>
        <polyline points="5 12 12 5 19 12"></polyline>
      </svg>
      <span>Посмотрите проект с ремонтом</span>
    </div>
  </div>

  <!-- Скрипты -->
  <script src="vendor/wolftour.js"></script>
  <script src="data.js"></script>
  <script src="index.js"></script>

</body>
</html>
